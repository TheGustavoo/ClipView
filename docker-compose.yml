services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clipview
      POSTGRES_USER: clipview
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipview -d clipview"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://clipview:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/clipview
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./apps/api
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-only-change-me-before-deploy}
      DATABASE_URL: postgresql+psycopg://clipview:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/clipview
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/var/uploads
      MAX_UPLOAD_BYTES: 524288000
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    ports:
      - "8000:8000"
    volumes:
      - video_uploads:/app/var/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./apps/api
    command: ["celery", "-A", "app.core.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    environment:
      SECRET_KEY: ${SECRET_KEY:-local-only-change-me-before-deploy}
      DATABASE_URL: postgresql+psycopg://clipview:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/clipview
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/var/uploads
      MAX_UPLOAD_BYTES: 524288000
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      HF_HOME: /home/clipview/.cache/huggingface
    volumes:
      - video_uploads:/app/var/uploads
      - model_cache:/home/clipview/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  video_uploads:
  model_cache:
